[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sweep-solver"
version = "0.2.0"
description = "Seismic Wave Equation Exploration Platform — equations, propagators, operators."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Shaowen Wang", email = "shaowen.wang@kaust.edu.sa"},
]
keywords = ["fwi", "geophysics", "seismic", "wave-equation", "propagator", "cuda", "pytorch", "jax"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
# JIT distribution: ONE wheel ships the C++/CUDA *sources* plus a prebuilt,
# torch-free CUDA core for CUDA 12 (sweep/lib/cu12/libsweep_core.so; more tags
# can ride along later) and compiles only the thin torch shim sweep._C against
# the user's OWN torch on first use (see sweep/_jit.py) -- plain C++, about a
# minute, needs a C++ compiler and the CUDA runtime headers torch's pip cu12
# wheels bring (or a toolkit's include dir), no nvcc -- so the wheel works with
# any torch version + any Python 3. torch is unpinned.
# nvcc (system / `module load cuda` / `conda install -c nvidia cuda-nvcc`) is
# needed only when no shipped core fits (torch built for another CUDA major, a
# card outside the shipped archs and older than the shipped PTX, sdist/clone
# install): then the core is built locally. The pip `nvidia-cuda-nvcc-cu12`
# wheel ships only ptxas, not the nvcc frontend.
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "torch",
    "ninja",
]

[project.optional-dependencies]
cuda  = ["torch"]
# The shipped core links cuFFT dynamically and the shim compiles against the
# CUDA runtime headers; both come from the pip nvidia-* wheels torch's cu12
# builds pull in. This extra is for a torch that did not (conda torch, a CPU
# wheel plus a system driver).
cuda12 = ["nvidia-cufft-cu12", "nvidia-cuda-runtime-cu12"]
torch = ["torch"]
jax   = ["jax", "jaxlib"]
all   = ["torch", "jax", "jaxlib"]
# Benchmark dataset loaders (sweep.datasets). Embedded demo models need
# nothing extra; parsing is numpy-only. This extra only adds the HTTP client
# used to fetch the downloadable full-size benchmarks.
datasets = ["requests>=2.25", "tqdm>=4.60"]

[project.urls]
Homepage = "https://github.com/DeepWave-KAUST/sweep"
Issues   = "https://github.com/DeepWave-KAUST/sweep/issues"

[project.scripts]
sweep = "sweep.cli:main"
sweep-datasets = "sweep.datasets.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sweep*", "geophyai*"]
exclude = ["sweep.csrc*", "sweep.lib*"]

# Ship the C++/CUDA sources inside the wheel — sweep._C is JIT-compiled from them
# on first use (csrc is data, not an importable package, hence excluded above).
[tool.setuptools.package-data]
sweep = [
    "csrc/**/*.cu", "csrc/**/*.cuh", "csrc/**/*.cpp",
    "csrc/**/*.h", "csrc/**/*.hpp", "csrc/**/CMakeLists.txt",
    # Prebuilt core (python -m sweep.build --core) + its core.json sidecar.
    # Wheel-only: MANIFEST.in prunes it from the sdist and git ignores it.
    "lib/**/*.so", "lib/**/*.json",
    # PEP 561: without py.typed a checker ignores the package entirely, so the
    # .pyi files shipped nothing and were never consulted by anyone.
    "py.typed", "**/*.pyi",
]
