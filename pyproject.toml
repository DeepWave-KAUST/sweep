[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geophyai"
version = "0.0.1"
authors = [
  { name="Shaowen Wang", email="shaowen.wang@kaust.edu.sa" },
]
description = "A.D. based package for seismic inverse problem."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"

[project.urls]
Homepage = "https://github.com/GeophyAI/geophyai"
Issues = "https://github.com/GeophyAI/geophyai/issues"

[project.scripts]
geophyai = "geophyai.cli:main"