[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sweep-solver"
version = "0.3.1"
description = "Seismic Wave Equation Exploration Platform — equations, propagators, operators."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Shaowen Wang", email = "shaowen.wang@kaust.edu.sa"},
]
keywords = ["fwi", "geophysics", "seismic", "wave-equation", "propagator", "cuda", "pytorch", "jax"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
# ONE wheel ships the C++/CUDA *sources* plus two prebuilt, torch-free CUDA
# cores, one per CUDA major (sweep/lib/cu12/ and sweep/lib/cu13/, each a
# libsweep_core.so + core.json); the loader picks the one torch's CUDA major
# names. cu12: V100 through H100/H200 as SASS, Blackwell via PTX. cu13: T4/RTX 20
# and newer with Blackwell native (nvcc 13 cannot emit sm_70, so no V100); it
# needs driver >= 580, exactly what torch cu130 needs.
# sweep._C is a pure-Python ctypes layer over that core's C API (sweep/backend/c/):
# nothing compiles after pip install -- no nvcc, no C++ compiler, no CUDA
# headers -- and no torch C++ ABI is involved, so the wheel works with any torch
# version + any Python >= 3.9. torch is unpinned.
# nvcc of torch's CUDA major (system / `module load cuda` / `conda install -c
# nvidia cuda-toolkit`; >= 12.4 for CUDA 12, >= 12.8 for Blackwell targets) is
# needed only when no shipped core fits (a torch built for a CUDA major with no
# core, a card outside the shipped archs and older than the shipped PTX, sdist/clone
# install): then the core is built locally. The pip `nvidia-cuda-nvcc-cu12`
# wheel ships only ptxas, not the nvcc frontend.
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "torch",
    "ninja",
]

[project.optional-dependencies]
cuda  = ["torch"]
# The shipped cores link cuFFT dynamically; torch's pip CUDA builds pull the
# matching wheel in. These extras are for a torch that did not (conda torch, a
# CPU wheel plus a system driver), one per core. cuFFT for CUDA 12 is the
# "-cu12"-suffixed wheel (11.x, nvidia/cufft/lib); cuFFT for CUDA 13 is the
# UNSUFFIXED "nvidia-cufft" 12.x (soname libcufft.so.12), which lands in
# nvidia/cu13/lib -- the core's rpath reaches both.
cuda12 = ["nvidia-cufft-cu12"]
cuda13 = ["nvidia-cufft>=12,<13"]
torch = ["torch"]
jax   = ["jax", "jaxlib"]
all   = ["torch", "jax", "jaxlib"]
# Benchmark dataset loaders (sweep.datasets). Embedded demo models need
# nothing extra; parsing is numpy-only. This extra only adds the HTTP client
# used to fetch the downloadable full-size benchmarks.
datasets = ["requests>=2.25", "tqdm>=4.60"]

[project.urls]
Homepage = "https://github.com/DeepWave-KAUST/sweep"
Issues   = "https://github.com/DeepWave-KAUST/sweep/issues"

[project.scripts]
sweep = "sweep.cli:main"
sweep-datasets = "sweep.datasets.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sweep*", "geophyai*"]
exclude = ["sweep.csrc*", "sweep.lib*"]

# Ship the C++/CUDA sources inside the wheel: sweep._C is a ctypes shim over the
# prebuilt core below, so nothing compiles; csrc is for the local core build when
# no shipped core fits, and the SWEEP_JIT_FULL=1 developer path (csrc is data,
# not an importable package, hence excluded above).
[tool.setuptools.package-data]
sweep = [
    "csrc/**/*.cu", "csrc/**/*.cuh", "csrc/**/*.cpp",
    "csrc/**/*.h", "csrc/**/*.hpp", "csrc/**/CMakeLists.txt",
    # Prebuilt core (python -m sweep.build --core) + its core.json sidecar.
    # Wheel-only: MANIFEST.in prunes it from the sdist and git ignores it.
    "lib/**/*.so", "lib/**/*.json",
    # PEP 561: without py.typed a checker ignores the package entirely, so the
    # .pyi files shipped nothing and were never consulted by anyone.
    "py.typed", "**/*.pyi",
]
