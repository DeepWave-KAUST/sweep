<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seismogram & free surface</title>
<style>
  :root{ --fg:#1f2429; --muted:#5c6672; --line:#dfe3e8; --panel:#f6f7f9; --accent:#3b6ea5; --accent-fg:#fff; }
  @media (prefers-color-scheme:dark){
    :root{ --fg:#e6e9ec; --muted:#98a2ad; --line:#333a42; --panel:#1b1f24; --accent:#5b8cc4; } }
  .wavelab{ font:14px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--fg); max-width:880px; }
  .wavelab .bar{ display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; padding:10px 12px;
                 background:var(--panel); border:1px solid var(--line); border-radius:10px; margin-bottom:9px; }
  .wavelab .grp{ display:flex; align-items:center; gap:6px; }
  .wavelab label{ color:var(--muted); white-space:nowrap; font-size:13px; }
  .wavelab select{ background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:7px; padding:5px 8px; font-size:13px; }
  .wavelab .seg{ display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .wavelab .seg button{ border:0; background:transparent; color:var(--fg); padding:5px 10px; cursor:pointer; font-size:13px; }
  .wavelab .seg button.on{ background:var(--accent); color:var(--accent-fg); }
  .wavelab button.btn{ border:1px solid var(--line); background:transparent; color:var(--fg); border-radius:7px; padding:5px 11px; cursor:pointer; font-size:13px; }
  .wavelab button.btn:hover{ border-color:var(--accent); }
  .wavelab button.btn.primary{ background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
  .wavelab input[type=range]{ width:100px; accent-color:var(--accent); }
  .wavelab .cap{ font-size:12px; color:var(--muted); margin:2px 2px 3px; }
  .wavelab canvas{ width:100%; height:auto; display:block; border:1px solid var(--line); border-radius:10px; background:#000; touch-action:none; }
  .wavelab #cv{ cursor:crosshair; }
  .wavelab .row{ display:grid; grid-template-columns:1fr; gap:6px; }
  .wavelab .val{ font-variant-numeric:tabular-nums; min-width:32px; color:var(--fg); }
</style>
</head>
<body>
<div class="wavelab">
  <div class="bar">
    <div class="grp"><label>Equation</label><select id="eq"></select></div>
    <div class="grp"><label>Tool</label>
      <span class="seg" id="tool"><button data-tool="paint" class="on">Paint</button><button data-tool="source">Source</button></span></div>
    <div class="grp"><label>Velocity</label>
      <input id="vel" type="range" min="1500" max="4500" step="50" value="2600"><span class="val" id="velVal">2600</span></div>
    <label class="grp"><input type="checkbox" id="fs" checked> Free surface</label>
    <button class="btn primary" id="play">Play</button>
    <button class="btn" id="reset">Reset</button>
    <div class="grp"><label>Model</label>
      <button class="btn" data-preset="reflector">Reflector</button>
      <button class="btn" data-preset="layered">Layered</button>
      <button class="btn" data-preset="clear">Clear</button></div>
  </div>

  <div class="cap">Wavefield (depth–x) · ▽ = receivers · ⊕ = source</div>
  <canvas id="cv" width="840" height="480"></canvas>
  <div class="cap">Shot gather (time–x) — traces recorded at the receivers, time increases downward</div>
  <canvas id="gather" width="840" height="300"></canvas>
</div>

<script>
(function(){
  "use strict";
  const NX=280, NZ=180, DH=10.0, VMIN=1500, VMAX=4500, F0=14.0, SUBSTEPS=4, BRUSH=10, N=NX*NZ;

  // ── Wave equations (scalar; free surface = p=0 at the top, see masks) ──────
  function makeAcoustic(){ // 4th-order-in-space acoustic
    let pp=new Float32Array(N), pc=new Float32Array(N), pn=new Float32Array(N), c2=new Float32Array(N);
    return { dt:()=>0.40*DH/VMAX,
      setModel:(vel,dt)=>{ const k=dt/DH; for(let i=0;i<N;i++){const v=vel[i]*k; c2[i]=v*v;} },
      reset:()=>{ pp.fill(0); pc.fill(0); pn.fill(0); },
      step:()=>{ for(let iz=2;iz<NZ-2;iz++){ const r=iz*NX; for(let ix=2;ix<NX-2;ix++){ const k=r+ix;
            const lap=(-(pc[k-2]+pc[k+2]+pc[k-2*NX]+pc[k+2*NX])+16*(pc[k-1]+pc[k+1]+pc[k-NX]+pc[k+NX])-60*pc[k])/12;
            pn[k]=2*pc[k]-pp[k]+c2[k]*lap; } } },
      source:(idx,s)=>{ pn[idx]+=s; },
      damp:(d)=>{ for(let i=0;i<N;i++){ pn[i]*=d[i]; pc[i]*=d[i]; } },
      swap:()=>{ const t=pp; pp=pc; pc=pn; pn=t; }, field:()=>pc };
  }
  function makeVisco(ALPHA){
    let pp=new Float32Array(N), pc=new Float32Array(N), pn=new Float32Array(N), c2=new Float32Array(N); let dtLoc=0;
    return { dt:()=>0.50*DH/VMAX,
      setModel:(vel,dt)=>{ dtLoc=dt; const k=dt/DH; for(let i=0;i<N;i++){const v=vel[i]*k; c2[i]=v*v;} },
      reset:()=>{ pp.fill(0); pc.fill(0); pn.fill(0); },
      step:()=>{ const a=ALPHA*dtLoc; for(let iz=1;iz<NZ-1;iz++){ const r=iz*NX; for(let ix=1;ix<NX-1;ix++){ const k=r+ix;
            const lap=pc[k-1]+pc[k+1]+pc[k-NX]+pc[k+NX]-4*pc[k]; pn[k]=((2-a)*pc[k]-(1-a)*pp[k]+c2[k]*lap)/(1+a); } } },
      source:(idx,s)=>{ pn[idx]+=s; },
      damp:(d)=>{ for(let i=0;i<N;i++){ pn[i]*=d[i]; pc[i]*=d[i]; } },
      swap:()=>{ const t=pp; pp=pc; pc=pn; pn=t; }, field:()=>pc };
  }
  const EQUATIONS=[
    { label:'Acoustic', make:()=>makeAcoustic() },
    { label:'Visco-acoustic (lossy)', make:()=>makeVisco(2.5) },
  ];

  // ── Absorbing masks: dampFull (4 sides) and dampFS (3 sides + p=0 top) ─────
  const dampFull=new Float32Array(N), dampFS=new Float32Array(N), PAD=22;
  const ramp=(d)=>{ if(d>=PAD) return 1.0; const a=(PAD-d)/PAD; return Math.exp(-(0.09*a)*(0.09*a)*30.0); };
  for(let iz=0;iz<NZ;iz++)for(let ix=0;ix<NX;ix++){ const k=iz*NX+ix;
    const dSides=Math.min(ix,NX-1-ix,NZ-1-iz);          // left, right, bottom
    dampFull[k]=ramp(Math.min(dSides,iz));               // + top absorbing
    dampFS[k]=(iz===0)?0.0:ramp(dSides);                 // top row = pressure release
  }

  // ── Velocity models ───────────────────────────────────────────────────────
  const vel=new Float32Array(N);
  function setClear(v){ vel.fill(v); modelDirty=true; }
  function setLayered(){ for(let iz=0;iz<NZ;iz++){ const v=1700+(iz/(NZ-1))*2400;
    for(let ix=0;ix<NX;ix++) vel[iz*NX+ix]=v; } modelDirty=true; }
  function setReflector(){ const zi=(NZ*0.55)|0;
    for(let iz=0;iz<NZ;iz++){ const v=iz<zi?2000:3300; for(let ix=0;ix<NX;ix++) vel[iz*NX+ix]=v; } modelDirty=true; }

  const T0=1.0/F0, SRC_DUR=2.4*T0;
  function ricker(tt){ const a=Math.PI*Math.PI*F0*F0, td=tt-T0, e=a*td*td; return (1-2*e)*Math.exp(-e); }

  // ── Receivers & gather buffer ─────────────────────────────────────────────
  const RECIZ=4, NREC=140, recX=new Int32Array(NREC);
  for(let r=0;r<NREC;r++) recX[r]=Math.min(NX-1, r*2);
  const NT=1900; const gather=new Float32Array(NT*NREC); let ti=0;
  function clearGather(){ gather.fill(0); ti=0; gdisp=0; }
  function recordRow(){ if(ti>=NT) return; const f=eng.field(), base=ti*NREC;
    for(let r=0;r<NREC;r++) gather[base+r]=f[RECIZ*NX+recX[r]]; ti++; }

  // ── Engine lifecycle ──────────────────────────────────────────────────────
  let eng, dt, modelDirty=true, srcIdx=(8*NX+(NX>>1))|0, srcActive=false, srcT=0, disp=0, gdisp=0;
  function build(idx){ eng=EQUATIONS[idx].make(); dt=eng.dt(); eng.reset(); modelDirty=true; disp=0; clearGather(); }
  function resetField(){ eng.reset(); srcActive=false; disp=0; clearGather(); }
  function advance(){
    if(modelDirty){ eng.setModel(vel,dt); modelDirty=false; }
    eng.step();
    if(srcActive){ eng.source(srcIdx,ricker(srcT)); srcT+=dt; if(srcT>SRC_DUR)srcActive=false; }
    eng.damp(fsEl.checked?dampFS:dampFull);
    eng.swap();
    recordRow();
  }

  // ── Rendering ─────────────────────────────────────────────────────────────
  const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  const off=document.createElement('canvas'); off.width=NX; off.height=NZ;
  const offctx=off.getContext('2d'), img=offctx.createImageData(NX,NZ), data=img.data;
  const gcv=document.getElementById('gather'), gctx=gcv.getContext('2d');
  const goff=document.createElement('canvas'); goff.width=NREC; goff.height=NT;
  const goffctx=goff.getContext('2d'), gimg=goffctx.createImageData(NREC,NT), gdata=gimg.data;

  function tint(val,g0){ // signed blue-white-red over a gray base g0
    let r,g,b; if(val>1)val=1; else if(val<-1)val=-1;
    if(val>=0){ r=g0+val*(255-g0); g=g0*(1-val); b=g0*(1-val); }
    else{ const a=-val; b=g0+a*(255-g0); r=g0*(1-a); g=g0*(1-a); }
    return [r,g,b];
  }
  function renderWave(){
    const fld=eng.field(); let mx=0;
    for(let i=0;i<N;i++){ const a=fld[i]<0?-fld[i]:fld[i]; if(a>mx)mx=a; }
    if(mx>1e-9){ disp+=(0.9/mx-disp)*0.15; }
    for(let i=0;i<N;i++){ const vnorm=(vel[i]-VMIN)/(VMAX-VMIN), g0=210-vnorm*115;
      const c=tint(fld[i]*disp,g0); const j=i<<2; data[j]=c[0]; data[j+1]=c[1]; data[j+2]=c[2]; data[j+3]=255; }
    offctx.putImageData(img,0,0); ctx.imageSmoothingEnabled=true; ctx.drawImage(off,0,0,cv.width,cv.height);
    // receivers
    ctx.fillStyle='#ffd23f'; const ry=RECIZ/NZ*cv.height;
    for(let r=0;r<NREC;r+=6){ const rx=recX[r]/NX*cv.width; ctx.beginPath();
      ctx.moveTo(rx-3,ry-4); ctx.lineTo(rx+3,ry-4); ctx.lineTo(rx,ry+1); ctx.closePath(); ctx.fill(); }
    // source
    const sx=(srcIdx%NX)/NX*cv.width, sz=((srcIdx/NX)|0)/NZ*cv.height;
    ctx.strokeStyle='#00e5ff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(sx,sz,6,0,7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx-9,sz); ctx.lineTo(sx+9,sz); ctx.moveTo(sx,sz-9); ctx.lineTo(sx,sz+9); ctx.stroke();
  }
  function renderGather(){
    let mx=0; const lim=ti*NREC;
    for(let i=0;i<lim;i++){ const a=gather[i]<0?-gather[i]:gather[i]; if(a>mx)mx=a; }
    if(mx>1e-9){ gdisp+=(0.9/mx-gdisp)*0.2; }
    for(let i=0;i<lim;i++){ const c=tint(gather[i]*gdisp,235); const j=i<<2; gdata[j]=c[0]; gdata[j+1]=c[1]; gdata[j+2]=c[2]; gdata[j+3]=255; }
    for(let i=lim;i<NT*NREC;i++){ const j=i<<2; gdata[j]=248; gdata[j+1]=248; gdata[j+2]=248; gdata[j+3]=255; }
    goffctx.putImageData(gimg,0,0); gctx.imageSmoothingEnabled=true; gctx.drawImage(goff,0,0,gcv.width,gcv.height);
  }
  let playing=false;
  function frame(){ if(playing){ for(let s=0;s<SUBSTEPS;s++) advance(); } renderWave(); renderGather(); requestAnimationFrame(frame); }

  // ── Interaction ───────────────────────────────────────────────────────────
  const eqEl=document.getElementById('eq'), velEl=document.getElementById('vel'), velVal=document.getElementById('velVal');
  const fsEl=document.getElementById('fs'), playBtn=document.getElementById('play');
  let tool='paint', painting=false;
  EQUATIONS.forEach((e,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=e.label; eqEl.appendChild(o); });
  function cell(e){ const r=cv.getBoundingClientRect();
    return [Math.floor((e.clientX-r.left)/r.width*NX), Math.floor((e.clientY-r.top)/r.height*NZ)]; }
  function paintAt(ix,iz){ const v=+velEl.value, R2=BRUSH*BRUSH;
    const x0=Math.max(1,ix-BRUSH),x1=Math.min(NX-2,ix+BRUSH),z0=Math.max(1,iz-BRUSH),z1=Math.min(NZ-2,iz+BRUSH);
    for(let z=z0;z<=z1;z++)for(let x=x0;x<=x1;x++){ const dx=x-ix,dz=z-iz; if(dx*dx+dz*dz<=R2) vel[z*NX+x]=v; }
    modelDirty=true; }
  function fire(ix,iz){ srcIdx=Math.min(N-1,Math.max(0,iz*NX+ix)); srcActive=true; srcT=0; clearGather();
    if(!playing){ playing=true; playBtn.textContent='Pause'; } }
  function act(e){ const c=cell(e); if(tool==='paint')paintAt(c[0],c[1]); else fire(c[0],c[1]); }
  cv.addEventListener('pointerdown',e=>{ painting=true; cv.setPointerCapture(e.pointerId); act(e); });
  cv.addEventListener('pointermove',e=>{ if(painting&&tool==='paint')act(e); });
  cv.addEventListener('pointerup',()=>painting=false);

  eqEl.addEventListener('change',()=>{ build(+eqEl.value); });
  document.getElementById('tool').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return;
    tool=b.dataset.tool; [...e.currentTarget.children].forEach(c=>c.classList.toggle('on',c===b));
    cv.style.cursor=tool==='source'?'cell':'crosshair'; });
  velEl.addEventListener('input',()=>velVal.textContent=velEl.value);
  fsEl.addEventListener('change',()=>{ resetField(); });
  playBtn.addEventListener('click',()=>{ playing=!playing; playBtn.textContent=playing?'Pause':'Play'; });
  document.getElementById('reset').addEventListener('click',resetField);
  document.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{
    const p=b.dataset.preset; if(p==='reflector')setReflector(); else if(p==='layered')setLayered(); else setClear(2500);
    resetField(); }));

  // ── Init ──────────────────────────────────────────────────────────────────
  setReflector(); build(0); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
