name: CPU test suite

# Nothing in this repository ran the tests. That was not an oversight anyone
# could act on either: `pytest test/` could not return 0, because
# test_import_does_not_pull_optional_deps asserted on the process-global
# sys.modules and so reported whatever the preceding ~600 tests had imported.
# Every recorded full-suite run ends "1 failed, 886 passed". With that fixed the
# suite is gateable, so this gates it.
#
# CPU only: GitHub's hosted runners have no GPU, so roughly 60% of the suite
# skips. That is still 313 real tests in ~3 minutes, and it catches the class of
# breakage that costs the most time -- an import cycle, a signature that moved,
# a validation rule that changed -- before it reaches a GPU box. The
# bit-exactness gate (gate/README.md) stays where the GPUs are.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: tests-cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One job ran the whole suite in ~15 min, most of it in a few dozen SEM /
    # Biot physics tests. Jobs of a few minutes each run side by side; a new
    # test file lands in `rest` (or in `sem` under test/sem/).
    #
    # test/sem without Biot took 25 min in one job, near the timeout. It runs in
    # four shards of about 6 min each (per-file times measured 2026-11-05):
    # sem-1..3 take the slowest files by name, `sem` everything else.
    #
    # `host_core: true` builds the host (CPU) core before the tests (the steps
    # below); a shard whose tests run impl='c' on the CPU sets it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sem-biot
            args: test/sem/test_biot_sem.py
            floor: 30
          - name: sem-1
            args: >-
              test/sem/test_biot_sem3d.py
              test/sem/test_sem_vs_cpml_absorption.py
              test/sem/test_sem_vs_cpml_derivative_order.py
            floor: 15
          - name: sem-2
            args: >-
              test/sem/test_sem_acoustic_bs_exact.py
              test/sem/test_sem_plane_wave.py
              test/sem/test_sem_tti3d.py
              test/sem/test_sem_visco_elastic3d.py
            floor: 50
          - name: sem-3
            args: >-
              test/sem/test_sem_fs_cpml_interface.py
              test/sem/test_sem_visco_elastic_displacement.py
              test/sem/test_sem_vs_bs_exact.py
            floor: 15
          - name: sem
            args: >-
              test/sem --ignore=test/sem/test_biot_sem.py
              --ignore=test/sem/test_biot_sem3d.py
              --ignore=test/sem/test_sem_vs_cpml_absorption.py
              --ignore=test/sem/test_sem_vs_cpml_derivative_order.py
              --ignore=test/sem/test_sem_acoustic_bs_exact.py
              --ignore=test/sem/test_sem_plane_wave.py
              --ignore=test/sem/test_sem_tti3d.py
              --ignore=test/sem/test_sem_visco_elastic3d.py
              --ignore=test/sem/test_sem_fs_cpml_interface.py
              --ignore=test/sem/test_sem_visco_elastic_displacement.py
              --ignore=test/sem/test_sem_vs_bs_exact.py
            floor: 300
          - name: rest
            args: test --ignore=test/sem --ignore=test/test_skill_snippets.py
            floor: 300
            host_core: true
          - name: skill
            args: test/test_skill_snippets.py
            floor: 8
            host_core: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install with a CPU-only torch
        run: |
          python -m pip install --upgrade pip
          # The CUDA wheel is ~2.5 GB and nothing here can use it.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . pytest
          # sweep._C is a pure-Python ctypes layer over a prebuilt CUDA core; a clone
          # carries none (src/sweep/lib is git-ignored) and the core needs a GPU anyway,
          # so nothing compiles at install and the tests that need it skip. The host
          # (CPU) core is built in its own step below.

      # The host core, built here rather than inside the first test that needs
      # it: about 5 min from scratch on a runner. The whole sweep_C drawer is
      # cached (staged sources and objects) under a key over everything the
      # build reads -- csrc, the build code, the compiler, ninja, the runner
      # image (the depfiles name its system headers) -- so a run that
      # restores it finds nothing to build, and any change to those builds the
      # core from scratch.
      - name: Look up the host core's cache key
        if: matrix.host_core
        id: hostcore
        run: python .github/scripts/host_core_cache_key.py >> "$GITHUB_OUTPUT"

      - name: Restore the host core
        if: matrix.host_core
        id: hostcore-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.hostcore.outputs.dir }}
          key: ${{ steps.hostcore.outputs.key }}

      - name: Build the host core
        if: matrix.host_core
        run: python -m sweep.build --cpu

      - name: Save the host core
        # right after the build, so a red test run still leaves the cache
        if: matrix.host_core && steps.hostcore-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.hostcore.outputs.dir }}
          key: ${{ steps.hostcore.outputs.key }}

      - name: Run the suite
        env:
          CUDA_VISIBLE_DEVICES: ''
          OMP_NUM_THREADS: '4'      # unbounded OMP thrashes a 2-core runner
        # --runslow: the long-run gates and long validations a local run skips
        # (test/conftest.py) run here
        run: pytest ${{ matrix.args }} -q --runslow --junitxml=report.xml

      - name: Refuse a green run that executed almost nothing
        # A skip is not a failure, and half this suite is gated on CUDA or on a
        # compiled binding: without a floor, "the tests passed" and "the tests
        # did not run" print the same summary. Each shard has its own floor,
        # well below what it executes on a CPU-only runner.
        run: python .github/scripts/assert_executed_floor.py report.xml ${{ matrix.floor }}

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.name }}
          path: report.xml
